<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Cashfree JavaScript SDK -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <link rel="stylesheet" href="expense.css" />
  </head>
  <body>
    <div class="page-wrap">
      <div class="tracker-card">
        <div class="tracker-header">
          <p id="premium-banner" class="premium-banner" hidden>
            <i class="bi bi-gem"></i> Welcome <span id="premium-user-name"></span><br />
            Thank you for being a Prime Member!
          </p>
          <div class="tracker-header-top">
            <div class="header-actions">
              <button
                type="button"
                id="premium-btn"
                class="premium-btn"
                title="Buy Premium Membership"
              >
                <i class="bi bi-gem"></i>
                <span id="premium-btn-label">Buy Premium</span>
              </button>

              <button
                type="button"
                id="leaderboard-btn"
                class="leaderboard-btn"
                title="View Leaderboard"
                disabled
              >
                <i class="bi bi-trophy-fill"></i>
                <span>Leaderboard</span>
              </button>

              <button
                type="button"
                id="reports-btn"
                class="reports-btn"
                title="View Reports"
                data-bs-toggle="modal"
                data-bs-target="#reportsModal"
                disabled
              >
                <i class="bi bi-bar-chart-fill"></i>
                <span>Reports</span>
              </button>
            </div>
          </div>
        </div>
       <div class="pagination-controls">

  <label for="page-size-select">
    Expenses per page:
  </label>

  <select
    id="page-size-select"
    class="form-select page-size-select"
  >
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="5">5</option>
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="30">30</option>
    <option value="40">40</option>
  </select>

</div>
        <div id="expenses-list" class="expenses-list">
          <h1>Expenses</h1>
          <p id="empty-state" class="empty-state">
            No expenses yet. Tap + to add one.
          </p>
        </div>

        <!-- Filled in at runtime by pagination.js -->
        <div id="pagination" class="pagination"></div>
      </div>
    </div>

    <button
      type="button"
      class="fab"
      data-bs-toggle="modal"
      data-bs-target="#addTransactionModal"
      title="Add transaction"
    >
      <i class="bi bi-plus-lg"></i>
    </button>

    <div
      class="modal fade"
      id="addTransactionModal"
      tabindex="-1"
      aria-labelledby="addTransactionLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addTransactionLabel">Add Expense</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="transaction-form" onsubmit="handleExpenseForm(event)">
            <div class="modal-body">
              <div class="mb-3">
                <label for="amount" class="field-label"
                  >Choose Expense Amount ($)</label
                >
                <input
                  type="number"
                  id="amount"
                  class="field-input"
                  placeholder="Enter amount"
                  min="0"
                  step="0.01"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="description" class="field-label"
                  >Choose Description</label
                >
                <input
                  type="text"
                  id="description"
                  class="field-input"
                  placeholder="Enter description"
                  required
                />
                <small id="category-suggestion" class="category-hint" hidden></small>
              </div>

              <div class="mb-3">
                <label for="category" class="field-label"
                  >Category</label
                >
                <input
                  type="text"
                  id="category"
                  class="field-input"
                  placeholder="AI will suggest one, or type your own"
                  required
                />
              </div>

              <div class="row g-2">
                <div class="col">
                  <button
                    type="submit"
                    id="add-expense-btn"
                    class="btn-action btn-expense w-100"
                  >
                    Add Expense
                  </button>
                </div>
              </div>

              <div id="form-message" class="form-message"></div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Leaderboard Modal -->
    <div
      class="modal fade"
      id="leaderboardModal"
      tabindex="-1"
      aria-labelledby="leaderboardModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="leaderboardModalLabel">
              <i class="bi bi-trophy-fill"></i> Expense Leaderboard
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="leaderboard-list" class="leaderboard-list">
              <p class="empty-state">Loading...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Reports Modal -->
    <div
      class="modal fade"
      id="reportsModal"
      tabindex="-1"
      aria-labelledby="reportsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="reportsModalLabel">
              <i class="bi bi-bar-chart-fill"></i> Day to Day Expenses
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="report-toolbar">
              <div class="report-view-toggle" role="group">
                <button type="button" class="report-view-btn active" data-view="daily">Daily</button>
                <button type="button" class="report-view-btn" data-view="weekly">Weekly</button>
                <button type="button" class="report-view-btn" data-view="monthly">Monthly</button>
              </div>

              <button
                type="button"
                id="download-report-btn"
                class="download-report-btn"
                title="Premium feature"
                disabled
              >
                <i class="bi bi-download"></i> Download
              </button>
            </div>

            <div id="report-table-container" class="report-table-container">
              <p class="empty-state">Loading...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="
https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js
"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="expense.js"></script>
    <script src="premium.js"></script>
    <script src="leaderboard.js"></script>
    <script src="pagination.js"></script>
    <script src="report.js"></script>

  </body>
</html>
